# Builds the tracker and publishes it to GitHub Pages on every push to main.
# Settings come from repository variables (Settings > Secrets and variables > Actions > Variables):
#   VITE_GOOGLE_CLIENT_ID  the Google OAuth client ID (Web application)
#   VITE_SHEET_ID          the tracker's Google Sheet ID
#   VITE_ALLOWED_EMAILS    optional, comma-separated; defaults to hello@alohateresa.com
# None of these are secrets: they all end up in the public page by design.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_SHEET_ID: ${{ vars.VITE_SHEET_ID }}
          VITE_ALLOWED_EMAILS: ${{ vars.VITE_ALLOWED_EMAILS }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
